name: Build Android APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  export:
    name: Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.tpz *.zip

      - name: Create debug keystore and Godot editor settings
        run: |
          mkdir -p ~/.android ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -noprompt

          SETTINGS='[gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "'"$ANDROID_SDK_ROOT"'"
          export/android/java_sdk_path = "'"$JAVA_HOME"'"
          export/android/debug_keystore = "'"$HOME"'/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          '
          echo "$SETTINGS" | sed 's/^ *//' > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cp ~/.config/godot/editor_settings-${GODOT_VERSION}.tres ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Import project resources
        run: |
          timeout 300 godot --headless --editor --quit || true

      - name: Run Headless Automated Tests
        continue-on-error: true
        run: |
          timeout 120 godot --headless -s tests/test_game_logic.gd

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/lanche_em_panico.apk
          ls -lh build/
          test -f build/lanche_em_panico.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanche-em-panico-apk
          path: build/lanche_em_panico.apk
          retention-days: 14
          if-no-files-found: error
