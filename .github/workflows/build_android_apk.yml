name: Build Android

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  ANDROID_PLATFORM: android-36
  BUILD_TOOLS: 36.1.0
  NDK_VERSION: 29.0.14206865
  VERSION_NAME: 3.2.0

jobs:
  build:
    name: Build APK (teste) e AAB (Play Store)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (API 36, build-tools, NDK)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" "ndk;${NDK_VERSION}" > /dev/null
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/platforms

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Baixar Godot e templates de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd /tmp
          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.tpz *.zip

      - name: Instalar Godot no PATH
        run: |
          sudo cp ~/godot-bin/godot /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Chave de teste fixa e configurações do editor
        run: |
          mkdir -p ~/.android ~/.config/godot
          # chave de teste FIXA (versionada em ci/): assim cada APK novo instala por cima do anterior
          cp ci/debug.keystore ~/.android/debug.keystore
          MAJOR_MINOR=$(echo $GODOT_VERSION | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres
          cp ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres ~/.config/godot/editor_settings-4.tres

      - name: Importar o projeto
        run: |
          timeout 600 godot --headless --editor --quit || true
          timeout 600 godot --headless --editor --quit || true

      - name: Testes automáticos
        run: timeout 120 godot --headless -s tests/test_game_logic.gd

      - name: Versão do app (versionCode cresce a cada build)
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${CODE}/; s/^version\/name=.*/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          echo "VERSION_CODE=${CODE}" >> $GITHUB_ENV
          grep -n "version/" export_presets.cfg

      - name: APK de teste (anúncios de TESTE do Google)
        env:
          # build otimizado (pequeno), assinado com a chave de teste FIXA para atualizar por cima
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --install-android-build-template --export-release "Android" build/lanche-em-panico.apk
          ls -lh build/
          test -f build/lanche-em-panico.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify build/lanche-em-panico.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging build/lanche-em-panico.apk | grep -E "package:|targetSdkVersion|sdkVersion" || true
          $AAPT dump xmltree --file AndroidManifest.xml build/lanche-em-panico.apk | grep -A2 "APPLICATION_ID" | head -6 || true

      - name: AAB assinado para a Play Store (anúncios REAIS)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets da chave de upload não configurados - pulando o AAB da Play Store. Veja PLAY_STORE.md."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/upload.jks
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/upload.jks
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASS"
          godot --headless --export-release "Android AAB" build/lanche-em-panico.aab
          rm -f /tmp/upload.jks
          ls -lh build/
          test -f build/lanche-em-panico.aab
          jarsigner -verify build/lanche-em-panico.aab | tail -1

      - name: Guardar arquivos do build
        uses: actions/upload-artifact@v4
        with:
          name: lanche-em-panico-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: build/*
          retention-days: 30
          if-no-files-found: error

      - name: Publicar Release com link direto (branch principal)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}-build${VERSION_CODE}"
          NOTES="APK para testar no celular (com anúncios de TESTE): lanche-em-panico.apk"
          if [ -f build/lanche-em-panico.aab ]; then
            NOTES="$NOTES
          AAB para enviar à Play Store (anúncios reais): lanche-em-panico.aab"
          fi
          gh release create "$TAG" build/* --title "Lanche em Pânico ${VERSION_NAME} (build ${VERSION_CODE})" --notes "$NOTES" --latest
