name: Teste no emulador Android

# Instala o APK num emulador, joga o tutorial com toques simulados e guarda o
# logcat + capturas de tela na pré-release "diagnostico". Serve para achar travamentos.

on:
  workflow_dispatch:
  push:
    branches-ignore: [ main-7787344074917853781 ]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  BUILD_TOOLS: 36.1.0
  NDK_VERSION: 29.0.14206865
  PKG: com.ferreiratecnologia.lancheempanico

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;android-36" "ndk;${NDK_VERSION}" > /dev/null

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Baixar Godot e templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd /tmp
          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.tpz *.zip

      - name: Godot + configurações
        run: |
          sudo cp ~/godot-bin/godot /usr/local/bin/godot && sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.android ~/.config/godot
          cp ci/debug.keystore ~/.android/debug.keystore
          MM=$(echo $GODOT_VERSION | cut -d. -f1,2)
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$HOME" > ~/.config/godot/editor_settings-${MM}.tres
          cp ~/.config/godot/editor_settings-${MM}.tres ~/.config/godot/editor_settings-4.tres
          timeout 600 godot --headless --editor --quit || true
          timeout 600 godot --headless --editor --quit || true

      - name: APK x86_64 para o emulador
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          sed -i '0,/architectures\/x86_64=false/s//architectures\/x86_64=true/' export_presets.cfg
          mkdir -p build
          # mesmo template do build da loja (GodotApp ajustado + R8), para testar o que vai para a Play
          rm -rf android && mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          bash ci/android_play_compat.sh android/build
          godot --headless --export-release "Android" build/emu.apk
          ls -lh build/

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar no emulador (Android 15, Google APIs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -no-boot-anim -camera-back none
          script: bash ci/emulator_play.sh

      - name: Publicar diagnóstico
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la diag || exit 0
          gh release view diagnostico > /dev/null 2>&1 || gh release create diagnostico --prerelease --title "Diagnóstico do emulador" --notes "Logcat e capturas do teste automático no emulador."
          gh release upload diagnostico diag/* --clobber
